description: >-
  FinOps view of Gradescope spend. Gradescope, a Turnitin company, is not a
  usage-metered API product; it is a SaaS assessment platform sold through
  institutional, sales-led agreements with custom per-institution pricing. There
  is no generally available public REST API and therefore no per-call, per-token,
  or per-request billing meter to allocate. Cost management is contract- and
  seat- / institution-oriented rather than consumption-oriented, so the meters
  below are framed around the institutional license rather than API usage.
notes: >-
  No usage-based API billing exists. Pricing is a custom institutional contract
  (reconciled false). Treat cost allocation as license/seat allocation across
  departments rather than API consumption. Verify contract structure with
  Gradescope / Turnitin during reconciliation.

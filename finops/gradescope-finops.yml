meters:
- name: institutional_license
  description: Annual institutional / departmental license fee, custom-quoted per institution.
  unit: contract
  aggregation: sum
  dimensions:
  - institution
  - department
- name: covered_seats
  description: Instructors and students covered under the institutional agreement, where applicable to the contract structure.
  unit: seats
  aggregation: sum
  dimensions:
  - institution
  - role
principles:
- name: Visibility
  description: Track the institutional contract value and renewal terms centrally; there is no per-call usage export because no public API is metered.
- name: Allocation
  description: Allocate the institutional license cost across departments / courses by seat or usage share for internal chargeback.
- name: Optimization
  description: Right-size the agreement to active instructors and courses; consolidate LMS integration via LTI 1.3 to avoid duplicate tooling.
- name: Accountability
  description: Assign a license owner per institution; review utilization and renewal annually against budget.

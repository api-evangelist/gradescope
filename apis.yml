name: Gradescope
kind: company
description: Gradescope, a Turnitin company, is an assessment and grading platform
  for paper-based, digital, and code assignments used across higher education and
  K-12. It does not publish a generally available public REST API; programmatic
  integration is delivered through LTI 1.3 / LTI Advantage (roster and grade sync
  with Canvas, Blackboard, Brightspace/D2L, Moodle, and Sakai) and a documented
  autograder framework for code assignments. A first-party public API for
  courses, assignments, submissions, and grades is a published feature request
  but is not yet generally available.
